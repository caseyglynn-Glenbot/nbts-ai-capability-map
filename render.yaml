services:
  - type: web
    name: nbts-portal
    runtime: node
    plan: starter          # always-on. Use "free" to avoid cost (adds ~50s cold starts).
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PORTAL_USER
        sync: false        # set in the Render dashboard
      - key: PORTAL_PASS
        sync: false        # set in the Render dashboard

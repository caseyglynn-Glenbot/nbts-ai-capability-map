<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBTS Knowledge Vault</title>
<style>
  :root{
    --navy:#14304f; --navy-deep:#0d2138; --teal:#0085ad; --teal-soft:#4bb3cd;
    --orange:#e0922f; --ink:#1b2733; --muted:#6b7c8c; --line:#dfe6ec;
    --paper:#f6f8fa; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Calibri,'Segoe UI',system-ui,sans-serif;
    color:var(--ink); background:var(--paper); font-size:15px; line-height:1.55;
    display:flex; flex-direction:column; overflow:hidden;
  }
  a{color:var(--teal)}

  header{
    background:var(--navy); color:#fff; padding:10px 18px;
    display:flex; align-items:center; gap:16px; flex-shrink:0;
  }
  header h1{font-size:17px; margin:0; font-weight:600; letter-spacing:.2px}
  header .tag{
    font-size:11px; text-transform:uppercase; letter-spacing:.9px;
    color:var(--teal-soft); border:1px solid rgba(255,255,255,.25);
    padding:2px 7px; border-radius:3px;
  }
  header .spacer{flex:1}
  header a.home{color:#cfe0ea; text-decoration:none; font-size:13px}
  header a.home:hover{color:#fff; text-decoration:underline}
  #stamp{font-size:12px; color:#9fb6c6}

  #shell{flex:1; display:flex; min-height:0}

  /* ---- sidebar ---- */
  aside{
    width:280px; background:var(--white); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; flex-shrink:0;
  }
  .searchwrap{padding:12px; border-bottom:1px solid var(--line)}
  #search{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:inherit; font-size:14px;
  }
  #search:focus{outline:2px solid var(--teal); outline-offset:-1px; border-color:var(--teal)}
  #tree{overflow-y:auto; flex:1; padding:6px 0}
  .folder{
    font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted);
    padding:12px 14px 4px; font-weight:700;
  }
  .item{
    padding:5px 14px 5px 20px; cursor:pointer; font-size:14px;
    border-left:3px solid transparent; color:var(--ink);
  }
  .item:hover{background:#eef4f8}
  .item.active{background:#e4eff5; border-left-color:var(--teal); font-weight:600}
  .count{color:var(--muted); font-size:12px; font-weight:400}

  /* ---- main ---- */
  main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .tabs{
    display:flex; gap:2px; padding:0 14px; background:var(--white);
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .tab{
    padding:9px 16px; cursor:pointer; font-size:14px; color:var(--muted);
    border-bottom:2px solid transparent; background:none; border-top:0;
    border-left:0; border-right:0; font-family:inherit;
  }
  .tab:hover{color:var(--navy)}
  .tab.active{color:var(--navy); border-bottom-color:var(--orange); font-weight:600}
  .pane{flex:1; overflow:auto; display:none; min-height:0}
  .pane.on{display:block}
  #graphpane.on{display:flex; flex-direction:column; overflow:hidden}

  /* ---- graph ---- */
  .graphbar{
    padding:8px 14px; border-bottom:1px solid var(--line); background:var(--white);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px;
  }
  .graphbar select{
    font-family:inherit; font-size:13px; padding:4px 6px;
    border:1px solid var(--line); border-radius:4px;
  }
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-left:auto}
  .legend span{display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12px}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
  #graph{flex:1; background:var(--navy-deep); cursor:grab; min-height:0}
  #graph:active{cursor:grabbing}
  #graph line{stroke:#3a5a78; stroke-width:1}
  #graph line.hot{stroke:var(--orange); stroke-width:2}
  #graph circle{cursor:pointer; stroke:var(--navy-deep); stroke-width:1.5}
  #graph circle:hover{stroke:#fff; stroke-width:2}
  #graph text{
    fill:#c8dae6; font-size:9px; pointer-events:none;
    font-family:Calibri,sans-serif;
  }
  #graph text.hot{fill:#fff; font-weight:700; font-size:11px}

  /* ---- note ---- */
  .note{max-width:820px; margin:0 auto; padding:28px 34px 70px}
  .crumb{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px}
  .note h1:first-of-type{margin-top:6px}
  .note h1{font-size:27px; color:var(--navy); border-bottom:2px solid var(--orange);
    padding-bottom:7px; margin:22px 0 14px}
  .note h2{font-size:21px; color:var(--navy); margin:26px 0 9px}
  .note h3{font-size:17px; color:var(--teal); margin:20px 0 7px}
  .note table{border-collapse:collapse; width:100%; margin:14px 0; font-size:14px}
  .note th{background:var(--navy); color:#fff; text-align:left; padding:7px 10px; font-weight:600}
  .note td{border:1px solid var(--line); padding:6px 10px; background:var(--white)}
  .note tr:nth-child(even) td{background:#fafcfd}
  .note code{background:#eef3f7; padding:1px 5px; border-radius:3px;
    font-family:Consolas,monospace; font-size:13px; color:#0a4d63}
  .note pre{background:var(--navy-deep); color:#dbe9f2; padding:13px 15px;
    border-radius:5px; overflow-x:auto}
  .note pre code{background:none; color:inherit; padding:0}
  .note blockquote{border-left:3px solid var(--teal); margin:14px 0;
    padding:2px 16px; color:var(--muted); background:#f2f7fa}
  .note img{max-width:100%}
  .note mark{background:#fdf0d5}
  .note hr{border:0; border-top:1px solid var(--line); margin:22px 0}
  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px dotted var(--teal-soft)}
  a.wl:hover{border-bottom-style:solid}

  .links{
    max-width:820px; margin:0 auto; padding:0 34px 40px;
    display:grid; grid-template-columns:1fr 1fr; gap:22px;
  }
  .links h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted);
    margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);
  }
  .links a{display:block; padding:3px 0; font-size:14px; text-decoration:none}
  .links a:hover{text-decoration:underline}
  .links .dead{color:#b0521f; cursor:default}
  .links .dead::after{content:' (not in vault)'; font-size:11px; color:var(--muted)}

  .msg{padding:44px 34px; color:var(--muted); max-width:640px; margin:0 auto; text-align:center}
  .msg strong{display:block; color:var(--navy); font-size:17px; margin-bottom:7px}
  .hit{padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; background:var(--white)}
  .hit:hover{background:#eef4f8}
  .hit b{color:var(--navy); font-size:15px}
  .hit i{color:var(--muted); font-style:normal; font-size:12px; margin-left:7px}
  .hit p{margin:3px 0 0; color:var(--muted); font-size:13px}

  @media(max-width:820px){
    aside{position:absolute; z-index:20; height:calc(100% - 44px); box-shadow:0 0 18px rgba(0,0,0,.2);
      transform:translateX(-100%); transition:transform .18s}
    aside.open{transform:none}
    #menu{display:block}
    .note,.links{padding-left:18px; padding-right:18px}
    .links{grid-template-columns:1fr}
  }
  #menu{display:none; background:none; border:1px solid rgba(255,255,255,.3);
    color:#fff; padding:4px 9px; border-radius:3px; cursor:pointer; font-family:inherit}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <button id="menu" aria-label="Toggle note list">Notes</button>
  <h1>NBTS Knowledge Vault</h1>
  <span class="tag">Read only</span>
  <span class="spacer"></span>
  <span id="stamp"></span>
  <a class="home" href="/home">Back to portal</a>
</header>

<div id="shell">
  <aside id="side">
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search notes" autocomplete="off">
    </div>
    <div id="tree"></div>
  </aside>

  <main>
    <div class="tabs">
      <button class="tab active" data-pane="notepane">Note</button>
      <button class="tab" data-pane="graphpane">Graph</button>
    </div>

    <div id="notepane" class="pane on">
      <div class="msg"><strong>Pick a note</strong>Choose one from the list, or open the graph to see how the vault connects.</div>
    </div>

    <div id="graphpane" class="pane">
      <div class="graphbar">
        <label for="folderpick">Folder</label>
        <select id="folderpick"><option value="">Everything</option></select>
        <button class="tab" id="replay" style="border:1px solid var(--line);border-radius:4px;padding:4px 10px">Re-run layout</button>
        <span class="legend" id="legend"></span>
      </div>
      <svg id="graph"></svg>
    </div>
  </main>
</div>

<script>
const API = 'https://glenbot.app.n8n.cloud/webhook/nbts-vault-api';
const PALETTE = ['#0085ad','#e0922f','#4bb3cd','#8fbf3f','#c96a9b','#f0c419','#7a8ff0','#e06b4f','#3fb59b','#b08fd0'];

let allNotes = [], folderColor = {}, sim = null, currentSlug = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(params){
  const r = await fetch(API + '?' + new URLSearchParams(params));
  if(!r.ok) throw new Error('Request failed (' + r.status + ')');
  return r.json();
}
function fail(where, e){
  $(where).innerHTML = '<div class="msg"><strong>Could not load</strong>' + esc(e.message) +
    '. Check that the vault sync has run, then reload.</div>';
}

/* ---------- sidebar ---------- */
async function loadList(){
  allNotes = await api({action:'list'});
  const folders = [...new Set(allNotes.map(n => n.folder || 'Root'))].sort();
  folders.forEach((f,i) => folderColor[f] = PALETTE[i % PALETTE.length]);

  const pick = $('folderpick');
  folders.forEach(f => { const o = document.createElement('option'); o.value = o.textContent = f; pick.appendChild(o); });

  $('legend').innerHTML = folders.slice(0,6).map(f =>
    '<span><i class="dot" style="background:' + folderColor[f] + '"></i>' + esc(f) + '</span>').join('');

  drawTree(allNotes);
  $('stamp').textContent = allNotes.length + ' notes';
}
function drawTree(notes){
  const byFolder = {};
  notes.forEach(n => { (byFolder[n.folder || 'Root'] ??= []).push(n); });
  $('tree').innerHTML = Object.keys(byFolder).sort().map(f =>
    '<div class="folder">' + esc(f) + ' <span class="count">' + byFolder[f].length + '</span></div>' +
    byFolder[f].map(n => '<div class="item" data-slug="' + esc(n.slug) + '">' + esc(n.title) + '</div>').join('')
  ).join('');
}
$('tree').addEventListener('click', e => {
  const el = e.target.closest('.item');
  if(el) location.hash = '#/' + el.dataset.slug;
});

/* ---------- search ---------- */
let timer;
$('search').addEventListener('input', e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if(q.length < 2){ drawTree(allNotes); return; }
  timer = setTimeout(async () => {
    try{
      const hits = await api({action:'search', q, limit:30});
      showTab('notepane');
      $('notepane').innerHTML = hits.length
        ? hits.map(h => '<div class="hit" data-slug="' + esc(h.slug) + '"><b>' + esc(h.title) +
            '</b><i>' + esc(h.folder || 'Root') + '</i><p>' + esc(h.snippet) + '</p></div>').join('')
        : '<div class="msg"><strong>No matches</strong>Nothing in the vault mentions that yet.</div>';
    }catch(err){ fail('notepane', err); }
  }, 260);
});
$('notepane').addEventListener('click', e => {
  const el = e.target.closest('.hit');
  if(el) location.hash = '#/' + el.dataset.slug;
});

/* ---------- note ---------- */
async function openNote(slug){
  showTab('notepane');
  $('notepane').innerHTML = '<div class="msg">Loading</div>';
  try{
    const d = await api({action:'note', slug});
    if(!d || !d.note){
      $('notepane').innerHTML = '<div class="msg"><strong>Not in the vault</strong>' + esc(slug) +
        ' is linked from another note but has no page yet.</div>';
      return;
    }
    currentSlug = slug;
    const n = d.note;
    $('notepane').innerHTML =
      '<div class="note"><div class="crumb">' + esc(n.folder || 'Root') + '</div>' +
      (/^\s*<h1/i.test(n.body_html || '') ? '' : '<h1>' + esc(n.title) + '</h1>') +
      (n.body_html || '<p><em>This note is empty.</em></p>') + '</div>' +
      '<div class="links"><div><h4>Links out</h4>' +
        (d.outbound.length ? d.outbound.map(l => l.resolved
          ? '<a href="#/' + esc(l.slug) + '">' + esc(l.title) + '</a>'
          : '<a class="dead">' + esc(l.title) + '</a>').join('') : '<span class="count">None</span>') +
      '</div><div><h4>Linked from</h4>' +
        (d.backlinks.length ? d.backlinks.map(l =>
          '<a href="#/' + esc(l.slug) + '">' + esc(l.title) + '</a>').join('') : '<span class="count">None</span>') +
      '</div></div>';
    document.querySelectorAll('.item').forEach(i =>
      i.classList.toggle('active', i.dataset.slug === slug));
    $('notepane').scrollTop = 0;
    $('side').classList.remove('open');
  }catch(err){ fail('notepane', err); }
}

/* ---------- graph ---------- */
async function drawGraph(folder){
  const svg = $('graph');
  svg.innerHTML = '<text x="20" y="30" fill="#9fb6c6">Building layout</text>';
  let data;
  try{ data = await api(folder ? {action:'graph', folder} : {action:'graph'}); }
  catch(err){ svg.innerHTML = '<text x="20" y="30" fill="#e0922f">' + esc(err.message) + '</text>'; return; }

  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  const nodes = data.nodes.map(n => ({...n,
    x: W/2 + (Math.random()-.5)*W*.7, y: H/2 + (Math.random()-.5)*H*.7, vx:0, vy:0}));
  const index = new Map(nodes.map((n,i) => [n.id, i]));
  const edges = data.edges.filter(e => index.has(e.source) && index.has(e.target));

  if(!nodes.length){
    svg.innerHTML = '<text x="20" y="30" fill="#9fb6c6">No notes in this folder yet.</text>';
    return;
  }

  if(sim) clearInterval(sim);
  let step = 0;
  sim = setInterval(() => {
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx + dy*dy || .01;
        if(d2 > 90000) continue;
        const f = 900 / d2, d = Math.sqrt(d2);
        const fx = f*dx/d, fy = f*dy/d;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for(const e of edges){
      const a = nodes[index.get(e.source)], b = nodes[index.get(e.target)];
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .01;
      const f = (d - 95) * .012;
      const fx = f*dx/d, fy = f*dy/d;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for(const n of nodes){
      n.vx += (W/2 - n.x) * .0016; n.vy += (H/2 - n.y) * .0016;
      n.vx *= .82; n.vy *= .82;
      n.x = Math.max(26, Math.min(W-26, n.x + n.vx));
      n.y = Math.max(20, Math.min(H-20, n.y + n.vy));
    }
    render(svg, nodes, edges, index);
    if(++step > 220) { clearInterval(sim); sim = null; }
  }, 16);
}
function render(svg, nodes, edges, index){
  const parts = [];
  for(const e of edges){
    const a = nodes[index.get(e.source)], b = nodes[index.get(e.target)];
    const hot = (a.id === currentSlug || b.id === currentSlug) ? ' class="hot"' : '';
    parts.push('<line' + hot + ' x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
      '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '"/>');
  }
  for(const n of nodes){
    const r = Math.min(4 + (n.degree || 0) * 1.1, 14);
    const hot = n.id === currentSlug;
    parts.push('<circle data-slug="' + esc(n.id) + '" cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) +
      '" r="' + r.toFixed(1) + '" fill="' + (folderColor[n.folder || 'Root'] || '#0085ad') +
      '"' + (hot ? ' stroke="#fff" stroke-width="2.5"' : '') + '><title>' + esc(n.title) +
      ' — ' + esc(n.folder || 'Root') + '</title></circle>');
    if(r > 6 || hot)
      parts.push('<text' + (hot ? ' class="hot"' : '') + ' x="' + n.x.toFixed(1) +
        '" y="' + (n.y - r - 3).toFixed(1) + '" text-anchor="middle">' + esc(n.title) + '</text>');
  }
  svg.innerHTML = parts.join('');
}
$('graph').addEventListener('click', e => {
  const c = e.target.closest('circle');
  if(c) location.hash = '#/' + c.dataset.slug;
});
$('folderpick').addEventListener('change', e => drawGraph(e.target.value));
$('replay').addEventListener('click', () => drawGraph($('folderpick').value));

/* ---------- chrome ---------- */
function showTab(pane){
  document.querySelectorAll('.tab[data-pane]').forEach(t =>
    t.classList.toggle('active', t.dataset.pane === pane));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === pane));
}
document.querySelectorAll('.tab[data-pane]').forEach(t => t.addEventListener('click', () => {
  showTab(t.dataset.pane);
  if(t.dataset.pane === 'graphpane') drawGraph($('folderpick').value);
}));
$('menu').addEventListener('click', () => $('side').classList.toggle('open'));
window.addEventListener('hashchange', route);

function route(){
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if(slug) openNote(slug);
}
(async function(){
  try{ await loadList(); }catch(err){ fail('notepane', err); return; }
  route();
})();
</script>
</body>
</html>

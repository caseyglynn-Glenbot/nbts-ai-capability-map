<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NBTS AI Platform | Sand Filter: How It Works</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
  :root{
    --sheet:#f9f9f7; --ink:#1c1e21; --ink-2:#5c6168; --rule:#c9ccd0; --panel:#ffffff;
    --leader:#d1202b; --accent:#2a63b8; --track:#dfe2e6; --focus:#2a63b8; --glass:rgba(255,255,255,.9);
    --ok:#1e7a46; --warn:#b26a00; --dmark:#1f6fd6; --fmark:#1b8f45; --water:#1597c9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --sheet:#1b1d21; --ink:#e8e9eb; --ink-2:#a1a6ad; --rule:#3a3e45; --panel:#23262b; --leader:#ff5560; --track:#3a3e45; --glass:rgba(35,38,43,.92); --ok:#5cc28a; --warn:#f0a640; --dmark:#6aa8ff; --fmark:#5cc28a; --water:#4cc0ec; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --sheet:#1b1d21; --ink:#e8e9eb; --ink-2:#a1a6ad; --rule:#3a3e45; --panel:#23262b; --leader:#ff5560; --track:#3a3e45; --glass:rgba(35,38,43,.92); --ok:#5cc28a; --warn:#f0a640; --dmark:#6aa8ff; --fmark:#5cc28a; --water:#4cc0ec; color-scheme:dark; }
  html,body{height:100%}
  body{margin:0;background:var(--sheet);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
  #view{flex:1;position:relative;min-height:0;touch-action:none;cursor:grab;overflow:hidden}
  #view:active{cursor:grabbing}
  #view canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;pointer-events:none;overflow:visible;width:100%;height:100%}
  #overlay polyline{fill:none;stroke-width:1.1}
  #overlay text{font:600 11.5px/1 "Barlow Semi Condensed","Barlow",system-ui,sans-serif;letter-spacing:.03em}
  #overlay .halo{stroke:var(--sheet);stroke-width:4px;fill:var(--sheet);opacity:.9}
  #overlay g.d polyline{stroke:var(--dmark)} #overlay g.d text.t{fill:var(--dmark)}
  #overlay g.f polyline{stroke:var(--fmark)} #overlay g.f text.t{fill:var(--fmark)}
  #overlay g.n polyline{stroke:var(--leader)} #overlay g.n text.t{fill:var(--ink)}
  #overlay g.lbl text .nm{fill:var(--ink);font-weight:500}
  #loading{position:absolute;inset:0;display:grid;place-items:center;font:500 13px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  #hint{position:absolute;left:16px;bottom:10px;font:400 11px "Barlow",system-ui,sans-serif;color:var(--ink-2);letter-spacing:.03em;pointer-events:none}

  #steps{position:absolute;left:16px;top:14px;width:min(300px,calc(100% - 32px));background:var(--glass);border:1px solid var(--rule);border-top:2px solid var(--ink);padding:10px 12px 8px;box-sizing:border-box;backdrop-filter:blur(4px)}
  #steps .kicker{font:600 10px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--leader);margin-bottom:6px}
  #steps ol{list-style:none;margin:0;padding:0}
  #steps li{border-top:1px solid var(--rule)}
  #steps li:first-child{border-top:0}
  #steps li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px 1fr;gap:0 8px;width:100%;padding:6px 0;cursor:pointer;color:var(--ink-2)}
  #steps li button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  #steps li button::before{content:attr(data-n);grid-row:1 / span 2;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font:600 11px "Barlow Semi Condensed",system-ui,sans-serif}
  #steps .h{font:600 13px/1.25 "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  #steps .d{display:none;font-size:12.5px;line-height:1.4;color:var(--ink);margin-top:3px}
  #steps li.on button{color:var(--ink)}
  #steps li.on button::before{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  #steps li.on .d{display:block}
  #steps li.done button::before{content:'\2713';color:var(--accent);border-color:var(--accent)}

  #readout{position:absolute;right:16px;top:14px;width:214px;background:var(--glass);border:1px solid var(--rule);border-top:2px solid var(--ink);padding:8px 12px 6px;box-sizing:border-box;backdrop-filter:blur(4px);pointer-events:none}
  #readout .kicker{font:600 10px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
  #readout dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 10px}
  #readout dt,#readout dd{margin:0;padding:5px 0;border-top:1px solid var(--rule);font:500 11px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
  #readout dt{color:var(--ink-2)}
  #readout dd{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  #readout dd.go{color:var(--ok)} #readout dd.mid{color:var(--warn)} #readout dd.stop{color:var(--leader)} #readout dd.wet{color:var(--water)}

  #bar{border-top:1.5px solid var(--ink);background:var(--panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center}
  #bar h1{margin:0;font:600 15px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  #bar h1 small{display:block;font:400 11px/1.4 "Barlow",system-ui,sans-serif;letter-spacing:.04em;color:var(--ink-2);text-transform:none;margin-top:3px}
  .ctrl{display:flex;align-items:center;gap:10px;min-width:0}
  .ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
  .ctrl .tick{font:500 11px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .btns button{font:500 12px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:2px;padding:6px 10px;cursor:pointer}
  .btns button:hover{background:var(--track)}
  .btns button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  #pbar{flex:none;background:var(--panel);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  #pbar .brand{font:800 17px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;color:#1E4B8C;letter-spacing:.01em}
  #pbar .brand span{color:#0085AD}
  #pbar .crumbs{display:flex;gap:9px;align-items:center;font:600 12.5px "Barlow",system-ui,sans-serif;color:var(--ink-2);margin-left:auto}
  #pbar .crumbs a{color:#0085AD;text-decoration:none}
  #pbar .crumbs a:hover{text-decoration:underline}
  #pbar .crumbs .sep{color:var(--rule)}

  @media (max-width:760px){
    #pbar{padding:8px 16px} #pbar .crumbs{margin-left:0;width:100%}
    #bar{grid-template-columns:1fr;gap:8px}
    .btns{justify-content:flex-start}
    #steps{top:auto;bottom:8px;left:8px;width:calc(100% - 16px);padding:6px 10px 4px}
    #steps li:not(.on){display:none}
    #steps .kicker{margin-bottom:2px}
    #readout{right:8px;top:8px;width:176px;padding:6px 8px 4px}
    #readout dt,#readout dd{white-space:nowrap;font-size:10px;padding:4px 0}
    #readout dl > :nth-child(n+5){display:none}
    #readout{width:150px}
    #overlay g.lbl .nm{display:none}
    #hint{display:none}
  }
  #cfg{margin:0 0 8px}
  #cfg .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:4px}
  #cfg .lab{font:600 10px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);width:52px}
  #cfg button{font:600 12px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:2px;padding:3px 8px;cursor:pointer}
  #cfg button:hover{background:var(--track)}
  #cfg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  #cfgnote{font:400 11.5px/1.35 "Barlow",system-ui,sans-serif;color:var(--ink-2);margin:0 0 8px}
  @media (max-width:760px){ #cfgnote{display:none} #cfg{margin-bottom:2px} #cfg .row{margin-bottom:2px} }
</style>
</head>
<body>

<div id="pbar">
  <div class="brand">Neptune Benson<span>.</span> &nbsp;NBTS AI</div>
  <nav class="crumbs"><a href="/home">Home</a><span class="sep">&middot;</span><a href="/product-animations">Product Animations</a><span class="sep">&middot;</span><span>Horizontal Sand Filter</span></nav>
</div>
<div id="stage">
  <div id="view">
    <svg id="overlay" aria-hidden="true"></svg>
    <div id="loading">Loading sand filter model…</div>
    <div id="steps" aria-live="polite">
      <div class="kicker">Sand filter · filter and backwash</div>
      <div id="cfg" role="group" aria-label="Face piping configuration"></div>
      <div id="cfgnote"></div>
      <ol id="steplist"></ol>
    </div>
    <div id="readout" aria-hidden="true">
      <div class="kicker">Filter status</div>
      <dl id="rdl"></dl>
    </div>
    <div id="hint">Drag to look around · scroll to zoom</div>
  </div>
  <div id="bar">
    <h1>48048SHFFGS · Sand Filter<small id="sub">48 in horizontal sand filter, filter mode and backwash.</small></h1>
    <div class="ctrl">
      <span class="tick" id="tnow">0:00</span>
      <input id="prog" type="range" min="0" max="1000" value="0" aria-label="Animation timeline">
      <span class="tick" id="tend">0:54</span>
    </div>
    <div class="btns">
      <button id="play" aria-pressed="false">Play</button>
      <button id="loop" aria-pressed="false">Loop</button>
      <button id="labels" aria-pressed="true">Labels</button>
      <button id="resetview">Reset view</button>
    </div>
  </div>
</div>

<script src="/assets/sp55-exploded/three.min.js"></script>
<script src="/assets/defender-schematic/assembly-loader.js"></script>
<script>
(function(){
  const view=document.getElementById('view'), overlay=document.getElementById('overlay');
  const prog=document.getElementById('prog'), playBtn=document.getElementById('play'), loopBtn=document.getElementById('loop'), tnow=document.getElementById('tnow'), tend=document.getElementById('tend');
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const ease=t=>{t=clamp(t,0,1); return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
  const smooth=t=>{t=clamp(t,0,1); return t*t*(3-2*t);};
  const win=(t,a,b)=>smooth((t-a[0])/(a[1]-a[0]))*(1-smooth((t-b[0])/(b[1]-b[0])));
  const h1=n=>{ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); };
  const deg=Math.PI/180;

  // ---- face piping configurations -----------------------------------------------------------------------------------------
  // Single (C1 to C4): one tank's face piping, native origin on the upper tank connection, lower connection at y -813.
  //   zc: pipe centreline off the tank face; vx: valve centres; px: pump riser; outX: end of the waste and pool runs.
  // Stacked: one valve nest for both tanks, native origin on the lower tank's lower connection. The CAD upper connections
  //   sit higher than the 48 in tank's (BU/TU); every run above the effluent header is moved down by dY to meet them.
  const CFGS={
    C1:{file:'face-c1.bin', tank:'4L', rot:false, zc:132,  vx:155, px:-355, inlet:{side:-487}, outX:232, pr:44,
        note:'3 in face piping, pump connection from the side. Shown on the 4 in tank connections.'},
    C2:{file:'face-c2.bin', tank:'6L', rot:true,  zc:-214, vx:242, px:-600, inlet:{side:-813}, outX:355, pr:84,
        note:'6 in face piping, pump connection from the side, on the 6 in tank connections.'},
    C3:{file:'face-c3.bin', tank:'4L', rot:false, zc:132,  vx:155, px:-355, inlet:{top:132},   outX:232, pr:44,
        note:'3 in face piping, pump connection from above. Shown on the 4 in tank connections.'},
    C4:{file:'face-c4.bin', tank:'4L', rot:true,  zc:-159, vx:185, px:-414, inlet:{top:159},   outX:274, pr:57,
        note:'4 in face piping, pump connection from above, on the 4 in tank connections.'},
    'S-C1':{stack:true, file:'face-s-c1.bin', tank:'4L', dY:-203, tlShift:-127, xB:381, xPool:-254, zv:477, zh:203, zr:165, yT:1557, inTop:1771, bwY:606, wOut:540, wDir:1, BU:1016, TU:2413, poolTop:1752, rIn:84, rW:57, rP:84, R:48,
        note:'4 in connections with 6 in headers. Pump header on the right, effluent valve on the left, waste to the right. Upper runs moved down 203 mm to meet the 48 in tank connections.'},
    'S-C2':{stack:true, file:'face-s-c2.bin', tank:'6L', dY:-489, tlShift:0, xB:737, xPool:-737, zv:811, zh:432, zr:270, yT:2253, inTop:2638, bwY:590, wOut:-270, wDir:-1, BU:1302, TU:2699, poolTop:2045, rIn:162, rW:110, rP:162, R:90,
        note:'8 in connections with 12 in headers and a gear-operated effluent valve. Pump header on the right, effluent valve and waste on the left. Shown on the 6 in tank connections; upper runs moved down 489 mm to fit.'},
    'S-C31':{stack:true, file:'face-s-c31.bin', tank:'6L', dY:-489, tlShift:0, xB:-737, xPool:737, zv:811, zh:432, zr:270, yT:2253, inTop:2638, bwY:590, wOut:270, wDir:1, BU:1302, TU:2699, poolTop:2045, rIn:162, rW:110, rP:162, R:90,
        note:'8 in connections with 12 in headers and a gear-operated effluent valve. Pump header on the left, effluent valve and waste on the right. Shown on the 6 in tank connections; upper runs moved down 489 mm to fit.'},
    'S-C32':{stack:true, file:'face-s-c32.bin', tank:'6L', dY:-489, tlShift:0, xB:-737, xPool:737, zv:811, zh:432, zr:270, yT:2253, inTop:2638, bwY:590, wOut:-1007, wDir:-1, BU:1302, TU:2699, poolTop:2045, rIn:162, rW:110, rP:162, R:90,
        note:'8 in connections with 12 in headers and a gear-operated effluent valve. Pump header on the left, effluent valve on the right, waste to the left. Shown on the 6 in tank connections; upper runs moved down 489 mm to fit.'}
  };
  const TANKS={'4L':'shffgs48048-4L.bin','6L':'shffgs48048-6L.bin'};
  const NOZ_U=407, NOZ_L=-406, TANK_DY=1397, FACE_Z=975, LOW=-813;

  // ---- timelines ----------------------------------------------------------------------------------------------------------
  // Operation per the Neptune Benson horizontal sand filter O&M (SHF O&M 4/7/16) and SHFFG tech data sheet (R 2/9/18).
  // The stacked nest has no backwash supply valve: one tank is backwashed with water filtered by the other.
  const MODES={
    single:{
      T_END:54,
      STEPS:[
        {t:0,  h:'Horizontal sand filter', d:'One 48 in fibreglass tank with 19.7 sq ft of filter area. The upper connection feeds the overdrain laterals and the lower connection collects from the underdrain laterals.'},
        {t:5,  h:'Filter mode', d:'The influent and effluent valves are open. Water from the pump enters the upper connection, spreads out of the overdrain laterals above the bed, passes down through the sand, and is collected by the underdrain laterals and returned to the pool.'},
        {t:15, h:'Dirt builds in the bed', d:'Dirt is trapped in the top of the sand bed. The influent gauge rises and the differential between the influent and effluent gauges climbs. Clean, it reads about 3 to 5 psi; backwash when it has risen 10 psi above that.'},
        {t:24, h:'Switch to backwash', d:'Each valve pair is linked to one lever. The upper lever closes the influent valve and opens the backwash waste valve in one move; the lower lever closes the effluent valve and opens the backwash supply valve.'},
        {t:29, h:'Backwash', d:'Water now enters the underdrain laterals and flows up through the bed. The sand lifts and expands, releasing the trapped dirt, which leaves through the overdrain laterals and the backwash line to waste. Watch the sight glass until the water runs clear.'},
        {t:40, h:'Back to filter mode', d:'Both levers return to their filter positions, the sand settles back into a level bed and the differential drops back to its clean reading.'}
      ],
      LEVERS:{up:[[24.4,25.6,0,1],[40.2,41.4,1,0]], low:[[25.8,27.0,0,1],[41.6,42.8,1,0]]},
      VSTATE:{V1:['up',1], V3:['up',0], V2:['low',1], V4:['low',0]},
      ROWS:[['mode','Mode'],['dp','Differential'],['bed0','Sand bed'],['V1','Influent valve'],['V2','Effluent valve'],['V4','Backwash supply'],['V3','Backwash waste'],['glass','Sight glass']],
      VLBL:{V1:'Influent valve', V3:'Backwash waste valve', V4:'Backwash supply valve', V2:'Effluent valve'},
      EV:{filter:[[5,24.6],[43,1e9]], dirt:[8,23.5], dpRise:[8,23]},
      BW:[{t:[28.2,40], ti:0, up:[28.6,30.6], down:[39.6,41.6], clean:[30,38]}],
      ghost:[4,44.4], valveSteps:[3,5], bwSteps:[4],
      PATH:[[0,'all'],[4,'all'],[6,'inside'],[23.4,'inside'],[24.4,'face'],[28.2,'face'],[29.4,'inside'],[34,'inside'],[35,'waste'],[39,'waste'],[40.2,'face'],[43.8,'face'],[45,'all'],[54,'all']]
    },
    stack:{
      T_END:66,
      STEPS:[
        {t:0,  h:'Stacked filters, one valve nest', d:'Two 48 in tanks, one on the other, each with 19.7 sq ft of filter area. Each tank has an influent and backwash waste valve pair on one lever; one effluent valve serves the header joining both lower connections.'},
        {t:5,  h:'Filter mode', d:'Both influent valves and the effluent valve are open. Water from the pump splits between the tanks, filters down through each sand bed and leaves both lower connections through the common header to the pool.'},
        {t:15, h:'Dirt builds in the beds', d:'Dirt is trapped in the top of both sand beds and the differential climbs. Clean, it reads about 3 to 5 psi; backwash when it has risen 10 psi above that.'},
        {t:24, h:'Backwash the lower tank', d:'The effluent valve closes. The lower tank’s lever closes its influent valve and opens its backwash waste valve.'},
        {t:28.2, h:'Lower tank backwash', d:'Water filters down through the upper tank, crosses the header into the lower tank’s underdrain and rises through its bed, lifting the sand and carrying the dirt out to waste. Watch the sight glass until it runs clear.'},
        {t:38.4, h:'Backwash the upper tank', d:'The lower tank’s lever returns to filter, then the upper tank’s lever closes its influent valve and opens its waste valve. Now the lower tank filters the water that backwashes the upper tank.'},
        {t:52.4, h:'Back to filter mode', d:'The upper lever returns and the effluent valve opens. Both beds settle and both tanks filter to the pool again.'}
      ],
      LEVERS:{E:[[24.4,25.4,0,1],[54.2,55.2,1,0]], A:[[25.8,27.0,0,1],[38.6,39.8,1,0]], B:[[40.2,41.4,0,1],[52.6,53.8,1,0]]},
      VSTATE:{Veff:['E',1], Vin0:['A',1], Vw0:['A',0], Vin1:['B',1], Vw1:['B',0]},
      ROWS:[['mode','Mode'],['dp','Differential'],['bed0','Lower bed'],['bed1','Upper bed'],['Veff','Effluent valve'],['Vin0','Lower influent'],['Vw0','Lower waste'],['Vin1','Upper influent'],['Vw1','Upper waste'],['glass','Sight glass']],
      VLBL:{Veff:'Effluent valve', Vin0:'Lower tank influent', Vw0:'Lower tank waste', Vin1:'Upper tank influent', Vw1:'Upper tank waste'},
      EV:{filter:[[5,24.6],[55.6,1e9]], dirt:[8,23.5], dpRise:[8,23]},
      BW:[{t:[28.2,38.4], ti:0, up:[28.6,30.6], down:[38,40], clean:[30,37]}, {t:[42,52.4], ti:1, up:[42.4,44.4], down:[52,54], clean:[44,51]}],
      ghost:[4,56.8], valveSteps:[3,5,6], bwSteps:[4],
      PATH:[[0,'all'],[4,'all'],[6,'inside'],[23.4,'inside'],[24.4,'face'],[27.8,'face'],[29,'inside'],[32.6,'inside'],[33.6,'waste'],[37.4,'waste'],[38.4,'face'],[41.6,'face'],[42.8,'inside'],[51.6,'inside'],[52.6,'face'],[55.6,'face'],[56.8,'all'],[66,'all']]
    }
  };
  let M=MODES.single;
  const leverAt=(mv,t)=>{ let k=mv[0][2], m=null; for(const [a,b,f,to] of mv){ if(t>=a){ k=f+(to-f)*ease((t-a)/(b-a)); if(t<b) m=to>f?1:-1; } } return {k,m}; };
  const valveAt=(key,t)=>{ const [lv,f]=M.VSTATE[key], {k,m}=leverAt(M.LEVERS[lv],t), s=f?1-k:k; return {s, mv: m? ((f?m>0:m<0)?'Closing':'Opening') : null}; };
  const bwOf=ti=>M.BW.find(b=>b.ti===ti);
  const dirtAt=(t,ti)=>{ const b=bwOf(ti); return smooth((t-M.EV.dirt[0])/(M.EV.dirt[1]-M.EV.dirt[0]))*(1-smooth((t-b.clean[0])/(b.clean[1]-b.clean[0]))); };
  const bedAt=(t,ti)=>{ const b=bwOf(ti); return 1+0.26*win(t,b.up,b.down); };
  const bwNow=t=>M.BW.find(b=>t>=b.t[0]&&t<b.t[1]+1);
  const bwDirty=t=>{ const b=bwNow(t)||M.BW[0]; return 0.85*(1-smooth((t-b.clean[0])/(b.clean[1]-b.clean[0])))+0.03; };
  const dpAt=t=>4+10*smooth((t-M.EV.dpRise[0])/(M.EV.dpRise[1]-M.EV.dpRise[0]))*(1-smooth((t-M.BW[0].t[0])/2));
  const ghostAt=t=>smooth((t-M.ghost[0])/1.6)*(1-smooth((t-M.ghost[1])/1.6));

  const stepList=document.getElementById('steplist');
  let stepLis=[], curStep=-1;
  function buildSteps(){ stepList.innerHTML=M.STEPS.map((s,i)=>`<li><button data-i="${i}" data-n="${i+1}"><span class="h">${s.h}</span><span class="d">${s.d}</span></button></li>`).join(''); stepLis=[...stepList.children]; curStep=-1; tend.textContent=fmt(M.T_END); }
  stepList.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; setTime(M.STEPS[+b.dataset.i].t+0.01); if(!playing) startPlay(); });
  function updateSteps(t){ let s=0; for(let i=0;i<M.STEPS.length;i++) if(t>=M.STEPS[i].t) s=i; if(s===curStep) return; curStep=s; stepLis.forEach((li,i)=>{ li.classList.toggle('on',i===s); li.classList.toggle('done',i<s); }); }

  // ---- configuration switch and load -------------------------------------------------------------------------------------------
  const cfgBox=document.getElementById('cfg'), cfgNote=document.getElementById('cfgnote'), sub=document.getElementById('sub');
  cfgBox.innerHTML=`<div class="row"><span class="lab">Single</span>${['C1','C2','C3','C4'].map(k=>`<button data-k="${k}" aria-pressed="false" title="${CFGS[k].note}">${k}</button>`).join('')}</div>`+
    `<div class="row"><span class="lab">Stacked</span>${['S-C1','S-C2','S-C31','S-C32'].map(k=>`<button data-k="${k}" aria-pressed="false" title="${CFGS[k].note}">${k.slice(2)}</button>`).join('')}</div>`;
  cfgBox.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&!loading) choose(b.dataset.k); });
  const bins={};
  const getBin=u=>bins[u]||(bins[u]=fetch(u,{credentials:'same-origin'}).then(r=>{ if(!r.ok) throw new Error('model '+r.status); return r.arrayBuffer(); }));
  let loading=false;
  function clearScene(){
    if(CUR){ scene.remove(CUR); CUR.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose()); }); }
    POINTS=[]; STREAMS=[]; ASM.length=0; BEDS.length=0; GLASS.length=0; ghostMeshes=[]; ghostLines=[]; lastGhost=-1; splitCache.clear();
    for(const k in VBODY) delete VBODY[k]; for(const k in VOBJ) delete VOBJ[k];
    LBL.forEach(L=>L.g.remove()); LBL=[]; TAGS.forEach(T_=>T_.g&&T_.g.remove()); TAGS=[];
  }
  function choose(k){
    if(!CFGS[k]) k='C4';
    loading=true; const ld=document.getElementById('loading'); if(ld){ ld.style.display=''; ld.textContent='Loading sand filter model…'; }
    [...cfgBox.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));
    const C=CFGS[k];
    return Promise.all([getBin('/assets/shffg/'+TANKS[C.tank]),getBin('/assets/shffg/'+C.file)]).then(([tb,fb])=>{
      clearScene(); CFG=C; CUR=new THREE.Group(); scene.add(CUR);
      const newMode=C.stack?MODES.stack:MODES.single, modeChanged=newMode!==M; M=newMode;
      if(modeChanged||!stepLis.length){ buildSteps(); if(T>M.T_END) T=0; }
      buildReadout();
      NAT[0]=faceMatrix(0); NAT[1]=faceMatrix(1);
      const A=loadAssembly(tb); CUR.add(A.root);
      A.root.traverse(o=>{ if(o.isMesh) o.material=o.material.clone(); });
      const tanks=C.stack?[0,1]:[0], offs=tanks.map(ti=>ti*31);
      if(!C.stack&&A.objs[TOP_TANK]) A.objs[TOP_TANK].visible=false;             // single configs: bottom tank only
      for(const off of offs){
        A.objs[3+off]&&A.objs[3+off].traverse(o=>{ if(o.isMesh) o.material.color.setHex(0x5a6b7a); });
        SADDLE.forEach(i=>A.objs[i+off]&&A.objs[i+off].traverse(o=>{ if(o.isMesh) o.material.color.setHex(0x2b4f86); }));
        [21,25].forEach(i=>A.objs[i+off]&&A.objs[i+off].traverse(o=>{ if(o.isMesh) o.material.color.setHex(PVC); }));
      }
      buildGhost(A,offs);
      if(C.stack){ buildFace(fb,0); for(const ti of tanks) buildInternals(ti); buildStreamsStack(); }
      else { buildFace(fb,0); buildInternals(0); buildStreamsSingle(); }
      CUR.updateMatrixWorld(true);
      // camera boxes for this piping
      const nest=new THREE.Box3(); CUR.children.filter(o=>o.isGroup&&o.matrixAutoUpdate===false).forEach(g=>nest.expandByObject(g));
      const top=C.stack?2040:660, far=Math.max(nest.max.z+60,1100);
      KEYS.all.box=BOX(V(Math.min(-760,nest.min.x),-760,-830),V(Math.max(760,nest.max.x),Math.max(top,nest.max.y),far));
      KEYS.face.box=nest.clone().expandByPoint(V(0,NOZ_L-120,900));
      KEYS.inside.box=BOX(V(-620,-760,-830),V(620,top,1000));
      const g0=GLASS[0].glass.getWorldPosition(V(0,0,0)), wb=new THREE.Box3().setFromCenterAndSize(g0,V(1,1,1));
      if(C.stack) wb.expandByPoint(VOBJ.Vw0[0].getWorldPosition(V(0,0,0))).expandByPoint(VOBJ.Vw1[0].getWorldPosition(V(0,0,0)));
      else { wb.expandByPoint(VOBJ.V3[0].getWorldPosition(V(0,0,0))); wb.expandByPoint(V(0,NOZ_U,900)); }
      wb.expandByScalar(C.stack?520:600); KEYS.waste.box=wb; KEYS.waste.th=g0.x<-100?130:50;
      Object.values(KEYS).forEach(fitKey);
      buildLabels(); buildTags();
      const nm=C.stack?'Stacked '+k.slice(2):k;
      cfgNote.textContent=nm+': '+C.note;
      sub.textContent=(C.stack?(C.tank==='6L'?'48048SHFFGS-6L':'48048SHFFGS-4L')+' stacked pair':'48 in single tank')+' with '+nm+' face piping. Laterals and sand shown schematically.';
      try{ const u=new URL(location.href); u.searchParams.set('c',k); history.replaceState(null,'',u); }catch(e){}
      if(ld) ld.style.display='none';
      loading=false; ready=true; resize(); setTime(T);
    }).catch(err=>{ loading=false; console.error(err); if(ld){ ld.style.display=''; ld.textContent='Could not load the model: '+err.message; } });
  }

  // ---- time and playback ----------------------------------------------------------------------------------------------------
  let T=0, needRender=true;
  function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function setTime(t){ T=clamp(t,0,M.T_END); prog.value=Math.round(T/M.T_END*1000); tnow.textContent=fmt(T); updateSteps(T); if(ready) applyState(T); needRender=true; }
  prog.addEventListener('input',()=>{ stopPlay(); setTime(prog.value/1000*M.T_END); });
  let playing=false, loop=false, last=performance.now();
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced) T=7;
  function startPlay(){ if(T>=M.T_END) T=0; playing=true; playBtn.textContent='Pause'; playBtn.setAttribute('aria-pressed','true'); }
  function stopPlay(){ playing=false; playBtn.textContent='Play'; playBtn.setAttribute('aria-pressed','false'); }
  playBtn.addEventListener('click',()=> playing?stopPlay():startPlay());
  loopBtn.addEventListener('click',()=>{ loop=!loop; loopBtn.setAttribute('aria-pressed',String(loop)); if(loop&&!playing) startPlay(); });
  document.getElementById('bar').addEventListener('keydown',e=>{ if(e.key===' '&&e.target.tagName!=='BUTTON'){ e.preventDefault(); playing?stopPlay():startPlay(); } });
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000); last=now; if(!ready||loading) return;
    if(playing){ let t=T+dt; if(t>=M.T_END){ if(loop) t=0; else { t=M.T_END; stopPlay(); } } setTime(t); }
    if(!reduced){ flowClock+=dt; needRender=true; }
    if(needRender){ needRender=false; updateCamera(); placeStreams(T); placeGrains(T); renderer.render(scene,camera); drawLabels(); }
  }
  requestAnimationFrame(frame);
  const startCfg=new URLSearchParams(location.search).get('c')||'C4';
  choose(CFGS[startCfg]?startCfg:startCfg.toUpperCase()).then(()=>{ if(!reduced&&ready) startPlay(); });
  window.SandFilter={ setTime:t=>{ stopPlay(); setTime(t); }, choose, get T(){ return T; }, get ASM(){ return ASM; }, get VOBJ(){ return VOBJ; }, camera, scene };
})();
</script>
